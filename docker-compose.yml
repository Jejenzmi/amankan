services:
  postgres:
    image: postgres:16-alpine
    container_name: amankan-postgres
    environment:
      POSTGRES_USER: amankan
      POSTGRES_PASSWORD: amankan
      POSTGRES_DB: amankan
    ports:
      - "5544:5432"
    volumes:
      - amankan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amankan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amankan-redis
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: amankan-neo4j
    environment:
      NEO4J_AUTH: neo4j/amankanpass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP browser UI
      - "7688:7687" # Bolt (host 7688 -> container 7687 to avoid local conflicts)
    volumes:
      - amankan_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  amankan_pgdata:
  amankan_neo4jdata:
